name: Setup Node + pnpm
description: Common CI setup

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10.x

    - name: Set node version
      uses: actions/setup-node@v6
      with:
        node-version: 22.x
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
