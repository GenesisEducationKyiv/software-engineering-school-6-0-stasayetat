syntax = "proto3";

package trackedrepo.v1;

message TrackRepoRequest {
  string id = 1;
  string repo = 2;
  string last_seen_tag = 3;
}

message TrackRepoResponse {
  string id = 1;
  string repo = 2;
  string last_seen_tag = 3;
}

message UntrackRepoRequest {
  string id = 1;
}

message UntrackRepoResponse {
  string message = 1;
}

service TrackedRepoService {
  rpc TrackRepo (TrackRepoRequest) returns (TrackRepoResponse);
  rpc UntrackRepo (UntrackRepoRequest) returns (UntrackRepoResponse);
}
